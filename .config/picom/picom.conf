# Nyxora: restrained compositor settings.
backend = "glx";
vsync = true;
shadow = true;
shadow-radius = 12;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.16;
shadow-exclude = [ "class_g = 'Polybar'", "class_g = 'Rofi'" ];
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 8;
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
detect-rounded-corners = true;
detect-client-opacity = true;
